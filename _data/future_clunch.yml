- speaker: Olawale Salaudeen
  url: https://www.olawalesalaudeen.com/
  affiliation: MSR / UIUC
  date: November 16th, 2026
  img: assets/img/clunch/olawale-salaudeen.jpg
  title: "On Construct Validity in AI: The Scientific Work We Have Yet to Do"
  abstract: |
    Evaluations of AI systems increasingly claim underlying latent attributes such as reasoning, alignment, and safety. However, the scientific foundations for making and evaluating such claims remain underdeveloped. Establishing construct validity requires theories of what these attributes are, how they relate to observable behavior, and whether they explain or predict behavior across tasks and settings. In this talk, I argue that much of this foundational scientific work remains to be done. I discuss why we might want to theorize about latent attributes of AI systems, what establishing their construct validity would require, and some of the conceptual and methodological challenges involved. I will introduce the AI Construct Lexis, a network of constructs and measurement instruments used in AI evaluation, as a resource for examining the theories implicitly embedded in current evaluation practices and motivating a more systematic science of AI attributes.
